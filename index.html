<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét QR → Tra cứu thiết bị Excel Online</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader { width: 300px; margin-bottom: 20px; }
    #result { white-space: pre-wrap; background: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h3>Quét QR để lấy thông tin thiết bị</h3>
  <div id="reader"></div>
  <div id="result">Kết quả sẽ hiển thị ở đây...</div>

  <script>
    async function onScanSuccess(decodedText) {
      // decodedText chính là ID thiết bị, ví dụ: "LAB-FAI-0001"
      let deviceID = decodedText.trim();
      document.getElementById("result").textContent = "QR ID: " + deviceID;

      try {
        const apiUrl = `https://graph.microsoft.com/v1.0/me/drive/root:/YOUR_PATH/CPT VN Lab Equipment Team Work Summary_.xlsx:/workbook/tables('EquipmentList')/rows?$filter=ID eq '${deviceID}'`;

        const response = await fetch(apiUrl, {
          headers: {
            "Authorization": "Bearer YOUR_ACCESS_TOKEN"
          }
        });

        if (!response.ok) throw new Error(`Lỗi API: ${response.status} ${response.statusText}`);

        const data = await response.json();

        if(data.value && data.value.length > 0){
          document.getElementById("result").innerHTML =
            "<strong>Thông tin thiết bị:</strong><br>" +
            JSON.stringify(data.value[0].values, null, 2);
        } else {
          document.getElementById("result").textContent = "Không tìm thấy thiết bị với ID: " + deviceID;
        }

      } catch (err) {
        document.getElementById("result").textContent = "Lỗi: " + err.message;
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: 200 },
      false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
