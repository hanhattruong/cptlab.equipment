    const driveId   = "b!1FxBlWj8ekuwPxAKTD-bpQEmUDASyytPjgSNLCERr-cX4itvhM5iRaNcje-tpPux";
    const itemId    = "01CPEFVA5SOSU4IOCPIFCZYG74B2GNPWPV";
    const tableName = "EquipmentList";
    const tableUsage = "UsingRecord";

    const colNames = [
      "Code","No","Category","Brand","Model_NO","Serial_No","Asset_Type",
      "LAB_Description","FA_Description","Specification","Control_NO","Assets_NO",
      "Responsible_By","Team","Location","Picture","Function","Week Control",
      "Purchase_Date","Supplier","Received_By","PO_No","Calibration_Date",
      "Due_Date","PM_Date","Next_PM","Status","Remark"
    ];

    const dateColumns = new Set(["Purchase_Date","Calibration_Date","Due_Date","PM_Date","Next_PM"]);
    const usageColNames = ["Code","LAB_Description","Usage_Date","User","Remark"];

    function excelSerialToDate(serial) {
      return new Date((serial - 25569) * 86400000);
    }

    function parseDateValue(val) {
      if (val == null || val === "") return null;
      if (typeof val === "number") return excelSerialToDate(val);
      if (typeof val === "string") {
        const iso = Date.parse(val);
        if (!Number.isNaN(iso)) return new Date(iso);
      }
      return null;
    }

    function formatDateForDisplay(date) {
      return date.toLocaleDateString("vi-VN");
    }

    const params = new URLSearchParams(window.location.search);
    const code   = params.get("code");
    const infoEl = document.getElementById("info");
    let labDescription = "";

    // ===== Load EquipmentList =====
    if (!code) {
      infoEl.innerText = "There is no code of Equipment on URL!";
    } else {
      fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableName}/rows`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        const row = data?.value?.find(r => r.values?.[0]?.[0] === code);
        if (row) {
          let html = "";
          const values = row.values[0];
          values.forEach((val, i) => {
            const colName = colNames[i];
            if (dateColumns.has(colName)) {
              const parsed = parseDateValue(val);
              if (parsed) val = formatDateForDisplay(parsed);
            }
            if (colName === "LAB_Description") labDescription = val ?? "";
            html += `<b>${colName}:</b> ${val ?? ""}<br>`;
          });
          infoEl.innerHTML = html;
          loadUsageHistory();
        } else {
          infoEl.innerHTML = '<span class="error">Cannot Found the Equipment!</span>';
          loadUsageHistory();
        }
      })
      .catch(() => {
        infoEl.innerHTML = '<span class="error">Error When Get Data!</span>';
        loadUsageHistory();
      });
    }

    // ===== Load Usage History (SORT DESC) =====
    function loadUsageHistory() {
      const tbody = document.getElementById("usageBody");

      if (!code) {
        tbody.innerHTML = '<tr><td colspan="5">No code in URL</td></tr>';
        return;
      }

      tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';

      fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        const rows = data?.value?.filter(r => r.values?.[0]?.[0] === code) ?? [];

        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="5">No usage record for this equipment.</td></tr>';
          return;
        }

        // --- Sort newest first ---
        rows.sort((a, b) => {
          const da = new Date(a.values[0][2]);
          const db = new Date(b.values[0][2]);
          return db - da;
        });

        tbody.innerHTML = "";
        rows.forEach(r => {
          const v = r.values[0];
          tbody.innerHTML += `
            <tr>
              <td>${v[0] ?? ""}</td>
              <td>${v[1] ?? ""}</td>
              <td>${v[2] ?? ""}</td>
              <td>${v[3] ?? ""}</td>
              <td>${v[4] ?? ""}</td>
            </tr>`;
        });
      })
      .catch(() => {
        tbody.innerHTML = '<tr><td colspan="5">Error loading usage records!</td></tr>';
      });
    }

    // ===== Save Usage =====
    document.getElementById("saveBtn").onclick = async () => {
      const usageDate = document.getElementById("usageDate").value;
      const userName  = document.getElementById("userName").value.trim();
      const remark    = document.getElementById("remark").value.trim();
      const statusEl  = document.getElementById("saveStatus");

      if (!usageDate) return statusEl.textContent = "Please select Usage Date!";
      if (!userName)  return statusEl.textContent = "Please enter User!";
      if (!code)      return statusEl.textContent = "No code in URL!";

      const newRow = { values: [[code, labDescription, { "@odata.type": "String", "value": usageDate }, userName, remark]] };
      statusEl.textContent = "Saving...";

      try {
        const res = await fetch(
          `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows/add`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${accessToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(newRow)
          }
        );

        if (!res.ok) throw new Error();

        statusEl.style.color = "green";
        statusEl.textContent = "Saved Successfully!";
        document.getElementById("usageDate").value = "";
        document.getElementById("userName").value  = "";
        document.getElementById("remark").value    = "";

        loadUsageHistory();
      } catch {
        statusEl.style.color = "red";
        statusEl.textContent = "Error saving data!";
      }
    };
  </script>
