const itemId = "01CPEFVA5SOSU4IOCPIFCZYG74B2GNPWPV";
const tableEquipment = "EquipmentList";
const tableUsage = "UsingRecord";

// ===== Globals =====
const codeIndex = 0;       // Code ở cột 0
const labIndex = 7;        // LAB_Description ở cột 7
let currentCode = "";
let currentLabDescription = "";

// ===== Get QR Code từ URL =====
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const infoEl = document.getElementById("info");

if (!code) {
  infoEl.innerHTML = '<span class="error">No code in URL!</span>';
} else {
  fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableEquipment}/rows`, {
    headers: { "Authorization": `Bearer ${accessToken}` }
  })
  .then(res => res.json())
  .then(data => {
    const rows = data.value || [];
    const row = rows.find(r => r.values?.[0]?.[codeIndex] === code);
    if (!row) {
      infoEl.innerHTML = '<span class="error">Cannot Found the Equipment!</span>';
      return;
    }
    const values = row.values[0];
    currentCode = values[codeIndex];
    currentLabDescription = values[labIndex] || "";

    infoEl.innerHTML = `<b>Code:</b> ${currentCode}<br><b>LAB_Description:</b> ${currentLabDescription}`;

    loadUsageHistory();
  })
  .catch(err => {
    console.error(err);
    infoEl.innerHTML = '<span class="error">Error fetching EquipmentList!</span>';
  });
}

// ===== Save Usage Record =====
document.getElementById("btnSave").onclick = async function() {
  const usageDate = document.getElementById("usageDate").value;
  const userName = document.getElementById("userInput").value.trim();
  const statusEl = document.getElementById("saveStatus");

  if (!usageDate) { statusEl.style.color="red"; statusEl.textContent="Select Usage Date!"; return; }
  if (!userName) { statusEl.style.color="red"; statusEl.textContent="Enter User!"; return; }
  if (!currentCode) { statusEl.style.color="red"; statusEl.textContent="No Equipment loaded!"; return; }

  const newRow = { values: [[currentCode, currentLabDescription, usageDate, userName, ""]] };
  statusEl.style.color="black";
  statusEl.textContent="Saving...";

  try {
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows/add`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(newRow)
    });
    if (!res.ok) throw new Error(await res.text());

    statusEl.style.color="green";
    statusEl.textContent="Saved Successfully!";
    document.getElementById("usageDate").value="";
    document.getElementById("userInput").value="";

    loadUsageHistory();
  } catch(err) {
    console.error(err);
    statusEl.style.color="red";
    statusEl.textContent="Error saving data!";
  }
};

// ===== Load Usage History =====
async function loadUsageHistory() {
  const tbody = document.getElementById("historyBody");
  tbody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

  try {
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows`, {
      headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const data = await res.json();
    const rows = (data.value || []).filter(r => r.values?.[0]?.[0] === currentCode);

    if (!rows.length) {
      tbody.innerHTML="<tr><td colspan='3'>No usage record yet.</td></tr>";
      return;
    }

    tbody.innerHTML = "";
    rows.forEach(r => {
      const v = r.values[0];
      tbody.innerHTML += `<tr><td>${v[2] || ""}</td><td>${v[3] || ""}</td><td>${v[4] || ""}</td></tr>`;
    });
  } catch(err) {
    console.error(err);
    tbody.innerHTML="<tr><td colspan='3'>Error loading history.</td></tr>";
  }
}
