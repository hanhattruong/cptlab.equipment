const filePath = '/Documents/Apps/CPT VN Lab Equipment Team Work Summary_.xlsx';
const tableName = 'EquipmentList';
const dateColumns = ['Purchase_Date','Calibration_Date','Due_Date','PM_Date','Next_PM'];

// ====== HELPER ======
function formatDate(value){
    if(!value) return '';
    const d = new Date(value);
    if(isNaN(d)) return value;
    return d.getDate().toString().padStart(2,'0') + '/' +
           (d.getMonth()+1).toString().padStart(2,'0') + '/' +
           d.getFullYear();
}

function getQueryParam(param){
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

// ====== LOAD EQUIPMENT DATA ======
let equipmentData = [];

async function loadEquipmentData(){
    try{
        // Lấy header
        const headerRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${filePath}:/workbook/tables/${tableName}/headerRowRange`,{
            headers: {'Authorization': `Bearer ${token}`}
        });
        const headerData = await headerRes.json();
        const headers = headerData.values[0];

        // Lấy rows
        const rowsRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${filePath}:/workbook/tables/${tableName}/rows`,{
            headers: {'Authorization': `Bearer ${token}`}
        });
        const rowsData = await rowsRes.json();

        // Map rows thành object
        equipmentData = rowsData.value.map(r=>{
            let obj = {};
            r.values[0].forEach((v,i)=>{ obj[headers[i]] = v });
            return obj;
        });

        console.log('Loaded equipment data:', equipmentData);

        // Nếu mở link có ?id=..., hiển thị luôn
        const idParam = getQueryParam('id');
        if(idParam){
            displayEquipment(idParam);
        }

    } catch(err){
        console.error('Error loading data:', err);
        document.getElementById('info').innerHTML = 'Failed to load equipment data. Check token or file path.';
    }
}

// ====== DISPLAY EQUIPMENT ======
function displayEquipment(code){
    const record = equipmentData.find(e => e.Code === code);
    if(record){
        let html = '<table>';
        for(const key in record){
            let val = record[key];
            if(dateColumns.includes(key)){
                val = formatDate(val);
            }
            html += `<tr><th>${key}</th><td>${val}</td></tr>`;
        }
        html += '</table>';
        document.getElementById('info').innerHTML = html;
    } else {
        document.getElementById('info').innerHTML = 'No equipment found for this code.';
    }
}

// ====== QR SCANNER ======
function onScanSuccess(decodedText, decodedResult){
    console.log('QR code scanned:', decodedText);
    // load data trước khi hiển thị
    if(equipmentData.length === 0){
        loadEquipmentData().then(()=> displayEquipment(decodedText));
    } else {
        displayEquipment(decodedText);
    }
}

let html5QrcodeScanner = new Html5Qrcode("reader");
html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
);

// ====== LOAD DATA ON PAGE LOAD ======
