<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>QR Scan → EquipmentList</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #reader { width: 300px; margin-bottom: 20px; }
    #info { margin-top: 20px; font-size: 14px; line-height: 1.5; }
    table { border-collapse: collapse; width: 100%; max-width: 800px; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h2>Quét QR Code → Thông tin thiết bị (EquipmentList)</h2>
  <div id="reader"></div>
  <div id="info"></div>

  <script>
    const csvUrl = "https://ttigroup-my.sharepoint.com/personal/nhattruong_ha_ttigroup_com_vn/Documents/Apps/CPT%20VN%20Lab%20Equipment%20Team%20Work%20Summary_.xlsx?web=1"; // Thay bằng link CSV trực tiếp từ SharePoint

    let equipmentData = [];

    // Load CSV từ SharePoint
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(results) {
        equipmentData = results.data;
      }
    });

    // Chuyển chuỗi ngày sang dd/mm/yyyy
    function formatDate(dateStr) {
      if(!dateStr) return "";
      const date = new Date(dateStr);
      if(isNaN(date)) return dateStr;
      const day = String(date.getDate()).padStart(2,'0');
      const month = String(date.getMonth()+1).padStart(2,'0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function showInfo(id) {
      const item = equipmentData.find(row => row.Code === id || row.No === id);
      const infoDiv = document.getElementById("info");
      if(item){
        let html = "<table>";
        for(const key in item){
          let value = item[key];
          // Format các cột ngày
          if(["Purchase_Date","Calibration_Date","Due_Date","PM_Date","Next_PM"].includes(key)){
            value = formatDate(value);
          }
          html += `<tr><th>${key}</th><td>${value}</td></tr>`;
        }
        html += "</table>";
        infoDiv.innerHTML = html;
      } else {
        infoDiv.innerHTML = "<b>Không tìm thấy thiết bị!</b>";
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      showInfo(decodedText.trim());
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
