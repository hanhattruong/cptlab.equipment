<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CPT LAB Scanner</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #info { margin-top: 20px; font-size: 14px; line-height: 1.5; }
    b { color: #333; }
  </style>
</head>
<body>
  <h2>Equipment/Fixture Information</h2>
  <div id="info">Loading Data...</div>

  <script>
    const accessToken = "YOUR_ACCESS_TOKEN_HERE";
    const driveId = "YOUR_DRIVE_ID";
    const itemId = "YOUR_ITEM_ID";
    const tableName = "EquipmentList";

    const colNames = ["Code","No","Category","Brand","Model_NO","Serial_No","Asset_Type",
                      "LAB_Description","FA_Description","Specification","Control_NO","Assets_NO",
                      "Responsible_By","Team","Location","Picture","Function","Week Control",
                      "Purchase_Date","Supplier","Received_By","PO_No","Calibration_Date",
                      "Due_Date","PM_Date","Next_PM","Status","Remark"];

    const dateCols = ["Purchase_Date","Calibration_Date","Due_Date","PM_Date","Next_PM"];

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    function formatDate(val){
      if(!val) return "";
      const d = new Date(val);
      if(isNaN(d.getTime())) return val; // nếu không phải ngày thì giữ nguyên
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    if(!code){
      document.getElementById("info").innerText = "There is no code of Equipment on URL!";
    } else {
      fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableName}/rows`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if(!data.value || !Array.isArray(data.value)){
          document.getElementById("info").innerText = "No data returned!";
          return;
        }

        const row = data.value.find(r => r.values && r.values[0][0] === code);
        if(row && row.values && row.values[0]){
          let html = "";
          row.values[0].forEach((val,i) => {
            val = val ?? ""; // nếu null hoặc undefined → ""
            if(dateCols.includes(colNames[i])){
              val = formatDate(val);
            }
            html += `<b>${colNames[i]}:</b> ${val}<br>`;
          });
          document.getElementById("info").innerHTML = html;
        } else {
          document.getElementById("info").innerText = "Cannot Find the Equipment!";
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById("info").innerText = "Error When Getting Data!";
      });
    }
  </script>
</body>
</html>
