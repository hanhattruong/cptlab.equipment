const driveId = "b!1FxBlWj8ekuwPxAKTD-bpQEmUDASyytPjgSNLCERr-cX4itvhM5iRaNcje-tpPux";
const itemId = "01CPEFVA5SOSU4IOCPIFCZYG74B2GNPWPV";
const tableEquipment = "EquipmentList";
const tableUsage = "UsingRecord";

const colNames = [
  "Code","No","Category","Brand","Model_NO","Serial_No","Asset_Type",
  "LAB_Description","FA_Description","Specification","Control_NO","Assets_NO",
  "Responsible_By","Team","Location","Picture","Function","Week Control",
  "Purchase_Date","Supplier","Received_By","PO_No","Calibration_Date",
  "Due_Date","PM_Date","Next_PM","Status","Remark"
];

const dateColumns = new Set([
  "Purchase_Date","Calibration_Date","Due_Date","PM_Date","Next_PM"
]);

function excelSerialToDate(serial) {
  const ms = (serial - 25569) * 86400000;
  return new Date(ms);
}

function parseDateValue(val) {
  if (val == null || val === "") return null;
  if (typeof val === "number") return excelSerialToDate(val);
  const iso = Date.parse(val);
  if (!Number.isNaN(iso)) return new Date(iso);
  return null;
}

function formatDateForDisplay(date) {
  return date.toLocaleDateString("vi-VN");
}

// ===== Get QR Code =====
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const infoEl = document.getElementById("info");
let labDescription = "";

if (!code) {
  infoEl.innerHTML = "There is no code of Equipment on URL!";
} else {
  fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableEquipment}/rows`, {
    headers: { "Authorization": `Bearer ${accessToken}` }
  })
  .then(res => res.json())
  .then(data => {
    const headerRow = data.value?.[0]?.values?.[0] || [];
    const codeColIndex = headerRow.findIndex(c => c === "Code");
    const labColIndex = headerRow.findIndex(c => c === "LAB_Description");

    if (codeColIndex === -1) {
      infoEl.innerHTML = '<span class="error">Cannot find column "Code"!</span>';
      return;
    }

    const row = data.value?.find(r => r.values?.[0]?.[codeColIndex] === code);
    if (!row) {
      infoEl.innerHTML = '<span class="error">Cannot Found the Equipment!</span>';
      return;
    }

    const values = row.values[0];
    labDescription = labColIndex !== -1 ? values[labColIndex] : "";

    let html = "";
    values.forEach((val, i) => {
      const colName = colNames[i] || `Column${i}`;
      if (dateColumns.has(colName)) {
        const parsed = parseDateValue(val);
        if (parsed) val = formatDateForDisplay(parsed);
      }
      html += `<b>${colName}:</b> ${val ?? ""}<br>`;
    });
    infoEl.innerHTML = html;

    // Load usage history
    loadUsageHistory();
  })
  .catch(err => {
    infoEl.innerHTML = '<span class="error">Error When Get Data!</span>';
    console.error(err);
  });
}

// ===== Save Usage Record =====
document.getElementById("btnRecord").onclick = async function() {
  const usageTime = document.getElementById("usageTime").value;
  const userName = document.getElementById("userInput").value.trim();
  const statusEl = document.getElementById("saveStatus");

  if (!usageTime) { statusEl.style.color="red"; statusEl.textContent="Please select Usage Date!"; return; }
  if (!userName) { statusEl.style.color="red"; statusEl.textContent="Please enter User!"; return; }

  statusEl.style.color="black";
  statusEl.textContent="Saving...";

  const newRow = { values: [[code, labDescription, usageTime, userName, ""]] };

  try {
    const url = `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows/add`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(newRow)
    });

    const text = await res.text();
    console.log("Response:", res.status, text);
    if (!res.ok) throw new Error(text);

    statusEl.style.color="green";
    statusEl.textContent="Saved Successfully!";
    document.getElementById("usageTime").value="";
    document.getElementById("userInput").value="";

    // Reload history
    loadUsageHistory();

  } catch (err) {
    statusEl.style.color="red";
    statusEl.textContent="Error saving data! Check console.";
    console.error("Error:", err);
  }
};

// ===== Load Usage History =====
async function loadUsageHistory() {
  const tbody = document.getElementById("historyBody");
  tbody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

  try {
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/workbook/tables/${tableUsage}/rows`, {
      headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const data = await res.json();

    // Filter rows by current code
    const rows = data.value?.filter(r => r.values?.[0]?.[0] === code) || [];
    if (!rows.length) { tbody.innerHTML="<tr><td colspan='3'>No usage record yet.</td></tr>"; return; }

    tbody.innerHTML = "";
    rows.forEach(r => {
      const v = r.values[0];
      const usageDate = v[2] || "";
      const user = v[3] || "";
      const remark = v[4] || "";
      tbody.innerHTML += `<tr><td>${usageDate}</td><td>${user}</td><td>${remark}</td></tr>`;
    });

  } catch(err) {
    tbody.innerHTML="<tr><td colspan='3'>Error loading history.</td></tr>";
    console.error("Error loading history:", err);
  }
}
